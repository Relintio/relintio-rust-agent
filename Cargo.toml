[package]
name = "relintio-agent"
version = "0.1.1"
edition = "2021"
description = "In-process protection agent for Rust web frameworks (Axum, Actix-web) powered by Relintio."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Relintio/relintio-rust-agent"
keywords = ["security", "middleware", "axum", "actix", "waf"]

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
md5 = "0.7"
hex = "0.4"
cookie = { version = "0.18", features = ["percent-encoding"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
percent-encoding = "2"
tower-service = "0.3"
http = "0.2"
futures-util = "0.3"
pin-project-lite = "0.2"
axum = { version = "0.6", optional = true }
actix-web = { version = "4", optional = true }

[features]
default = ["axum", "actix-web"]
axum = ["dep:axum"]
actix-web = ["dep:actix-web"]
